# wrangler.toml
name = 'confessional-api'
main       = "index.js"
compatibility_date = "2026-05-27"

# ── Pages ──────────────────────────────────────────────────────────────────────
# Static assets are served from /public via Cloudflare Pages.
# The Worker handles all /api/* routes via a Pages Functions proxy or
# a standalone Worker bound to the Pages project.

# ── D1 Database ────────────────────────────────────────────────────────────────
[[d1_databases]]
binding      = "DB"
database_name = "confessional-db"
database_id  = "22980ec2-fe0b-4135-a0e8-b3bf1bfdb37c"

# ── KV Namespace (rate limiting) ───────────────────────────────────────────────
[[kv_namespaces]]
binding    = "RATELIMIT"
id         = "0fbb936ba9f54bc985b30883111dbc75"    # replace after: wrangler kv:namespace create RATELIMIT
preview_id = "70c2a31fa2524276b2dd7dd5ce96983f"     # replace after: wrangler kv:namespace create RATELIMIT --preview

# ── Environment Variables ──────────────────────────────────────────────────────
[vars]
ALLOWED_ORIGIN = "https://confessional-api.lanticsechristiandryle.pages.dev"  # replace with your Pages URL
